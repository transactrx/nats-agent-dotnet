# Releases on every push to Production, the same way the Go library does:
# tests, then an auto-incremented v* tag + GitHub release, then the packages.
name: Release

on:
  push:
    branches:
      - Production

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: dotnet test -c Release

  release-on-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: rymndhng/release-on-push-action@master
        with:
          bump_version_scheme: patch
          tag_prefix: "v"
          use_github_release_notes: true

  publish:
    name: Pack and publish NuGet packages
    runs-on: ubuntu-latest
    needs: release-on-push
    if: needs.release-on-push.outputs.version != ''
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-on-push.outputs.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The library (TransactRx.NatsAgent) and the CLI tool (TransactRx.NatsAgent.Cli),
      # both stamped with the version of the tag just created.
      - name: Pack
        run: |
          VERSION="${{ needs.release-on-push.outputs.version }}"
          VERSION="${VERSION#v}"   # NuGet wants 1.2.3, not v1.2.3
          dotnet pack -c Release -o artifacts -p:Version="$VERSION"

      # The org's GitHub Packages feed: works with the workflow's own token.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      # nuget.org as well, once the repository has a NUGET_API_KEY secret. Skipped without it.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        if: env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
